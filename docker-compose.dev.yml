version: '3.8'

services:
  image-preprocessor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: image-preprocessor-api
    ports:
      - "3000:3000"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:3000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3